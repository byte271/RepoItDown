[package]
name = "repoitdown-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "AST-aware codebase topology engine for LLM context windows"
readme = "../../README.md"
keywords = ["llm", "codebase", "ast", "topology", "tree-sitter"]
categories = ["development-tools", "parsing"]

# SAFETY: This crate processes untrusted source code. No unsafe permitted.
# All FFI to Tree-sitter C grammars is isolated in repoitdown-cli.

[dependencies]
thiserror.workspace = true
rayon.workspace = true
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-python.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-go.workspace = true
ignore.workspace = true
petgraph.workspace = true
tiktoken-rs.workspace = true
tracing.workspace = true
serde.workspace = true
regex.workspace = true

[dev-dependencies]
tempfile = "3.14"
serde_json = { workspace = true }
criterion = { workspace = true, features = ["html_reports"] }

[[bench]]
name = "hot_paths"
harness = false
path = "benches/hot_paths.rs"

[lints.clippy]
# syn is a transitive dep with unavoidable version duplication
multiple_crate_versions = "allow"
