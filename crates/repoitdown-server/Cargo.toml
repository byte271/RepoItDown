[package]
name = "repoitdown-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "REST API server for RepoItDown — stateless HTTP endpoint for codebase topology generation"
readme = "../../README.md"
keywords = ["http", "api", "llm", "codebase", "topology"]
categories = ["development-tools", "web-programming::http-server"]

[dependencies]
repoitdown-core = { path = "../repoitdown-core" }
axum = { workspace = true }
tokio = { workspace = true, features = ["net"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
